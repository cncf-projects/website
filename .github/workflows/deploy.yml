name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx astro check

      # Actions does not expose the token to a step's environment on its own.
      # Without this mapping the build succeeds and publishes an empty page.
      - name: Build with discussion data
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A green build that published "No data" everywhere would be worse than a
      # red one, because nobody would notice.
      - name: Fail if no discussion data was baked in
        run: |
          if grep -q 'data-has-metrics="true"' dist/index.html; then
            echo "Discussion data present."
          else
            echo "::error::Build produced no discussion data; refusing to publish."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
