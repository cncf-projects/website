name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can GITHUB_TOKEN read another org's public discussions?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query { repository(owner:"cert-manager",name:"cert-manager"){ hasDiscussionsEnabled discussions{totalCount} } rateLimit{limit remaining} }'
